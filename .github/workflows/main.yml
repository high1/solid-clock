name: Build and Deploy 🕛
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  BASE: /${{ github.event.repository.name }}/

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7.0.1

      - name: Pnpm 🧱
        uses: pnpm/action-setup@v6.1.0

      - name: Node.js ⚓
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: 'package.json'
          cache: pnpm

      - name: Install 🔧
        run: pnpm i

      - name: Install playwright 🌐
        run: pnpm playwright

      - name: Check 🔎
        run: pnpm check

      - name: Lint 🧹
        run: pnpm lint

      - name: Test 🧪
        run: pnpm test

      - name: Test across timezones 🌍
        run: |
          for tz in America/New_York Europe/Berlin Australia/Sydney; do
            echo "::group::$tz"
            TZ=$tz VITE_TZ=$tz pnpm vitest run test/time.test.ts
            echo "::endgroup::"
          done

      - name: Build 🚧
        run: |
          pnpm build
          touch dist/.nojekyll

      - name: Upload artifact 📦
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

      - name: Deploy to GitHub Pages 🚀
        uses: actions/deploy-pages@v5.0.1
        if: github.ref == 'refs/heads/main'
